<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!-- Nur eigene Skripte und Stile; keine fremden Server, kein eval. Stil-Angaben setzt der Code über CSSOM. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://parentsday-briefkasten.feindt.workers.dev; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <!-- Digitaler Briefkasten: Wird MAILBOX_URL in js/config.js gesetzt, gehört dieselbe Adresse (z. B.
         https://parentsday-briefkasten.name.workers.dev) oben zu „connect-src“. Sonst blockiert der Browser jede
         Verbindung, und alle Eltern landen bei der Notlösung per E-Mail. Siehe docs/BRIEFKASTEN.md, Schritt 8;
         `npm test` prüft das. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ParentsDay – Elternsprechtag</title>
    <meta name="description" content="ParentsDay – Termine für den Elternsprechtag einfach zwischen Lehrkräften und Eltern abstimmen." />
    <meta name="theme-color" content="#1f5fae" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/views/start.css" />
    <link rel="stylesheet" href="css/views/teacher-auth.css" />
    <link rel="stylesheet" href="css/views/teacher-event.css" />
    <link rel="stylesheet" href="css/views/teacher-classes.css" />
    <link rel="stylesheet" href="css/views/teacher-class.css" />
    <link rel="stylesheet" href="css/views/responses.css" />
    <link rel="stylesheet" href="css/views/teacher-schedule.css" />
    <link rel="stylesheet" href="css/views/parent.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <noscript>
        <p class="noscript-note">ParentsDay benötigt JavaScript. Bitte aktivieren Sie JavaScript in Ihrem Browser.</p>
      </noscript>
    </div>
  </body>
</html>
